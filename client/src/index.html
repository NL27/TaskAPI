<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>
    <div class="app">
        <header>
            <h1>Tasks</h1>
            <button class="btn-add" id="btn-add">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </header>

        <div class="task-list" id="task-list">
            <!-- Tasks will be rendered here -->
        </div>

        <!-- Modal for adding/editing tasks -->
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modal-title">New Task</h2>
                    <button class="btn-close" id="btn-close">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <form id="task-form">
                    <input type="hidden" id="task-id">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" required placeholder="What needs to be done?">
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" required placeholder="Add details..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="responsible">Assigned to</label>
                            <input type="text" id="responsible" name="responsible" required placeholder="Who's responsible?">
                        </div>
                        <div class="form-group">
                            <label for="dueDate">Due date</label>
                            <input type="date" id="dueDate" name="dueDate" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="importance">Importance</label>
                            <select id="importance" name="importance" required>
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="createdBy">Your Name</label>
                            <input type="text" id="createdBy" name="createdBy" required placeholder="Your name">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">Save Task</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
